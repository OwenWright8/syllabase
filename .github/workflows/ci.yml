name: CI

on:
  pull_request:
  push:
    branches:
      - main

# CI only reads the repo; no job needs a write-scoped token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit -p tsconfig.app.json

      # Playwright transpiles specs without type-checking them.
      - run: npx tsc --noEmit -p e2e/tsconfig.json

      # Shell logic of the Docker setup (secret generation, the db entrypoint
      # wrapper, start.sh's config handling), under dash like the containers.
      - name: Container script tests
        run: bash docker/tests/run-all.sh

      # The document worker's logic (file-type checks, OCR decisions, job control
      # flow, limits), against a fake database and fake PDF tools. The real tools
      # and SQL run in the docker job below.
      - name: Document worker tests
        run: python3 -m unittest discover -s docker/worker/tests -v

      - run: npm run build

  # Browser tests against the real UI, with the backend replaced by an
  # in-memory fake (e2e/support/fakeBackend.ts) — no Docker or database needed.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

  # First-time database initialisation must be reliable. It has one shot: if an
  # init script fails, the container restarts, sees a data directory and skips
  # initialisation, leaving a half-configured database (this happened
  # intermittently before roles.sql tolerated absent optional roles). A single
  # run can't show a flake, so initialise a FRESH database several times and
  # require every one to be clean: no init error, and no restart, since the
  # failure "recovers" via a restart that a health check alone would not notice.
  db-init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the database image
        run: docker compose build db

      - name: Initialise a fresh database 10 times
        run: |
          for i in $(seq 1 10); do
            echo "=== fresh initialisation $i/10"
            docker compose up -d --wait --wait-timeout 120 db
            logs=$(docker compose logs db 2>&1)
            restarts=$(docker inspect -f '{{.RestartCount}}' "$(docker compose ps -q db)")
            if grep -qE "psql:.*ERROR|docker-entrypoint-initdb.d.*ERROR" <<<"$logs" || [ "$restarts" != "0" ]; then
              echo "FAILED on run $i (restarts=$restarts)"
              grep -nE "ERROR|FATAL" <<<"$logs" | head -20
              exit 1
            fi
            docker compose down -v
          done
          echo "all 10 fresh initialisations were clean"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # The images are also published for arm64 (Raspberry Pi, ARM servers). CI
  # can't run arm64 containers natively, but BUILDING the image proves the parts
  # most likely to break: every upstream image still ships arm64 and the binary
  # paths the Dockerfile copies exist in it. Not pushed.
  arm64-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the app image for arm64
        run: docker buildx build --platform linux/arm64 -f Dockerfile .

      - name: Build the database image for arm64
        run: docker buildx build --platform linux/arm64 -f Dockerfile.db .

  # Runs the real stack in Docker, exercising what a self-hoster does:
  #   1. zero-config: NO .env, `docker compose up`, sign up, use it (the main test)
  #   2. it survives a restart with the same secrets (what an upgrade does)
  #   3. it refuses to invent a database password if the secrets volume is lost
  #   4. an OLD-style .env (incl. SITE_URL) still works, so upgrades don't break
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: There is nothing to configure
        run: |
          test ! -e .env
          docker compose config >/dev/null

      # Build from source and actually run the full stack (db + app): a clean
      # build doesn't guarantee gotrue/postgrest/edge-runtime start and talk to
      # each other inside the merged container. No .env, no setup step: the
      # secrets are generated on first start.
      - name: Build and start the stack (no .env)
        run: docker compose up -d --build

      - name: Wait for the app and GoTrue
        run: ./scripts/wait-for-stack.sh

      # NOTE: the harness's own variables are prefixed CI_ on purpose. Docker
      # Compose gives a *shell* variable precedence over .env, so exporting
      # ANON_KEY here would silently override what the stack under test is given.
      #
      # The anon key is public (the frontend needs it), so read it back the way
      # a browser does. The API address must NOT be in there: the app uses the
      # address it was loaded from.
      - name: Read the public runtime config
        run: |
          body=$(curl -fsS http://localhost:8080/env.js)
          echo "$body"
          key=$(echo "$body" | sed -n 's/.*VITE_SUPABASE_PUBLISHABLE_KEY: "\(.*\)".*/\1/p')
          [ -n "$key" ]
          echo "$body" | grep -q 'VITE_SUPABASE_URL' && { echo "env.js must not carry an API address"; exit 1; }
          echo "CI_ANON_KEY=$key" >> "$GITHUB_ENV"

      - name: Secrets were generated and stored in the volume
        run: |
          docker compose exec -T db sh -c 'test -s /secrets/postgres_password'
          docker compose exec -T app sh -c 'test -s /secrets/jwt_secret && test -s /secrets/cron_secret'
          # ...owner-only
          docker compose exec -T app sh -c 'test "$(stat -c %a /secrets/jwt_secret)" = 600'

      - name: Fresh instance reports no accounts yet
        run: |
          body=$(curl -fsS -X POST http://localhost:8080/functions/v1/instance-status \
            -H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ANON_KEY}")
          echo "$body"
          echo "$body" | grep -q '"hasAccounts":false'

      - name: Sign up
        run: |
          code=$(curl -sS -o signup.json -w '%{http_code}' -X POST http://localhost:8080/auth/v1/signup \
            -H "apikey: ${CI_ANON_KEY}" -H "Content-Type: application/json" \
            -d '{"email":"ci-user@accounts.local","password":"ci-test-password-123"}')
          echo "HTTP ${code}"; cat signup.json; echo
          [ "$code" = "200" ]
          grep -q '"access_token"' signup.json

      - name: Log in
        run: |
          code=$(curl -sS -o login.json -w '%{http_code}' -X POST \
            "http://localhost:8080/auth/v1/token?grant_type=password" \
            -H "apikey: ${CI_ANON_KEY}" -H "Content-Type: application/json" \
            -d '{"email":"ci-user@accounts.local","password":"ci-test-password-123"}')
          echo "HTTP ${code}"
          [ "$code" = "200" ]
          grep -q '"access_token"' login.json
          echo "CI_ACCESS_TOKEN=$(sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p' login.json)" >> "$GITHUB_ENV"

      - name: Instance now reports an account exists (signup trigger + PostgREST + edge runtime)
        run: |
          body=$(curl -fsS -X POST http://localhost:8080/functions/v1/instance-status \
            -H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ANON_KEY}")
          echo "$body"
          echo "$body" | grep -q '"hasAccounts":true'

      # The class-time column (added by a migration) must exist, be writable under
      # RLS by its owner, and come back the way the frontend expects: a Postgres
      # `time` is returned as HH:MM:SS.
      - name: A course's class time round-trips through the real database
        run: |
          api=http://localhost:8080/rest/v1
          uid=$(python3 -c "import json;print(json.load(open('login.json'))['user']['id'])")
          auth=(-H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ACCESS_TOKEN}" -H "Content-Type: application/json")
          created=$(curl -fsS -X POST "$api/courses" "${auth[@]}" -H "Prefer: return=representation" \
            -d "{\"user_id\":\"${uid}\",\"name\":\"CI Course\",\"short_code\":\"CI 101\",\"color\":\"#3b82f6\",\"class_time\":\"10:30\"}")
          echo "$created"
          echo "$created" | grep -q '"class_time":"10:30:00"'
          id=$(python3 -c "import json,sys;print(json.loads(sys.argv[1])[0]['id'])" "$created")
          # cleared with null
          curl -fsS -X PATCH "$api/courses?id=eq.${id}" "${auth[@]}" -d '{"class_time":null}'
          curl -fsS "$api/courses?id=eq.${id}&select=class_time" "${auth[@]}" | grep -q '"class_time":null'
          curl -fsS -X DELETE "$api/courses?id=eq.${id}" "${auth[@]}"

      # Course materials, for real: uploads go through the actual REST API in 1 MiB
      # chunks, the actual worker reads them with the actual poppler/qpdf/tesseract,
      # and the actual database enforces who may do what. Covers a text PDF, an
      # image-only PDF, a photo and a Word file (OCR and extraction), an encrypted
      # PDF and garbage (refused with a message), the limits and column privileges,
      # and that a second user can see none of it. See scripts/ci-documents.py.
      - name: Install the libraries that generate the test files
        run: |
          python3 -m venv /tmp/fixtures-venv
          /tmp/fixtures-venv/bin/pip install --quiet reportlab pillow pypdf

      - name: Course documents work end to end (upload, OCR, rules, isolation)
        run: |
          API_URL=http://localhost:8080 ANON_KEY="${CI_ANON_KEY}" ACCESS_TOKEN="${CI_ACCESS_TOKEN}" \
            /tmp/fixtures-venv/bin/python scripts/ci-documents.py

      # The worker parses untrusted files, so its sandbox is checked, not assumed.
      - name: The document worker is sandboxed
        run: |
          docker compose exec -T app sh -c '
            pid=""
            for p in /proc/[0-9]*; do
              if tr "\0" " " < "$p/cmdline" 2>/dev/null | grep -q "python3 /app/worker/worker[.]py"; then pid=${p#/proc/}; fi
            done
            [ -n "$pid" ] || { echo "the worker is not running"; exit 1; }
            echo "worker pid $pid runs as: $(stat -c %U /proc/$pid)"
            [ "$(stat -c %U /proc/$pid)" = "syllabase-worker" ] || { echo "worker is not the unprivileged user"; exit 1; }
            grep -q "^NoNewPrivs:[[:space:]]*1" /proc/$pid/status || { echo "no_new_privs is not set"; exit 1; }
            if tr "\0" "\n" < /proc/$pid/environ | grep -E "^(POSTGRES_PASSWORD|JWT_SECRET|SERVICE_ROLE_KEY|ANON_KEY|CRON_SECRET)="; then
              echo "a secret is in the worker environment"; exit 1
            fi
            uid=$(id -u syllabase-worker); gid=$(id -g syllabase-worker)
            if setpriv --reuid=$uid --regid=$gid --clear-groups cat /secrets/jwt_secret >/dev/null 2>&1; then echo "the worker can read /secrets"; exit 1; fi
            if setpriv --reuid=$uid --regid=$gid --clear-groups sh -c "echo x > /app/worker/pwned" 2>/dev/null; then echo "the worker can modify its own code"; exit 1; fi
            echo "sandbox ok: unprivileged, no_new_privs, no secrets in its environment, cannot read /secrets or edit /app"
          '

      - name: The worker's database role can only touch the document tables
        run: |
          run_sql() {
            docker compose exec -T db sh -c 'PGPASSWORD="$(cat /secrets/postgres_password)" psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=0 -Atc "$1"' _ "$1" 2>&1 || true   # psql exits 1 on a denied query; the checks read the text
          }
          denied() { out=$(run_sql "SET ROLE syllabase_worker; $1"); echo "  $1"; echo "    -> $out" | head -2; grep -qi "permission denied" <<<"$out"; }
          allowed() { out=$(run_sql "SET ROLE syllabase_worker; $1"); echo "  $1 -> ok"; ! grep -qi "permission denied\|does not exist" <<<"$out"; }
          allowed "SELECT count(*) FROM public.course_documents"
          allowed "SELECT count(*) FROM public.course_document_chunks"
          allowed "SELECT count(*) FROM public.document_limits"
          allowed "SELECT count(*) FROM public.document_chapters"
          allowed "SELECT count(*) FROM public.document_extracts"
          denied  "SELECT count(*) FROM public.tasks"
          denied  "SELECT count(*) FROM public.profiles"
          denied  "SELECT count(*) FROM auth.users"
          denied  "UPDATE public.course_documents SET size_bytes = 1 WHERE false"
          denied  "UPDATE public.course_documents SET user_id = user_id WHERE false"
          denied  "INSERT INTO public.course_documents (user_id) SELECT null WHERE false"
          denied  "UPDATE public.document_extracts SET user_id = user_id WHERE false"
          denied  "UPDATE public.document_extracts SET start_page = 1 WHERE false"
          denied  "INSERT INTO public.document_extracts (user_id) SELECT null WHERE false"
          denied  "UPDATE public.document_chapters SET title = 'x' WHERE false"

      # The kill switch: DOCUMENTS=off must stop the worker and refuse uploads at
      # the database, not just hide a button. Then put the default back.
      - name: DOCUMENTS=off stops the worker and refuses uploads
        run: |
          DOCUMENTS=off docker compose up -d app
          ./scripts/wait-for-stack.sh
          docker compose logs app 2>&1 | grep -q "not starting the worker"
          if docker compose exec -T app sh -c 'for p in /proc/[0-9]*; do tr "\0" " " < "$p/cmdline" 2>/dev/null | grep -q "worker[.]py" && exit 0; done; exit 1'; then
            echo "the worker is still running"; exit 1
          fi
          enabled=$(curl -fsS "http://localhost:8080/rest/v1/document_limits?select=enabled" -H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ACCESS_TOKEN}")
          echo "limits: $enabled"
          echo "$enabled" | grep -q '"enabled":false'
          uid=$(python3 -c "import json;print(json.load(open('login.json'))['user']['id'])")
          course=$(curl -fsS -X POST http://localhost:8080/rest/v1/courses -H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ACCESS_TOKEN}" -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "{\"user_id\":\"${uid}\",\"name\":\"Off\",\"short_code\":\"OFF\",\"color\":\"#000000\"}" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['id'])")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/rest/v1/course_documents -H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ACCESS_TOKEN}" -H "Content-Type: application/json" \
            -d "{\"user_id\":\"${uid}\",\"course_id\":\"${course}\",\"kind\":\"syllabus\",\"filename\":\"x.pdf\",\"size_bytes\":1000}")
          echo "upload while off -> HTTP $code"
          [ "$code" = "403" ] || [ "$code" = "401" ]
          curl -fsS -X DELETE "http://localhost:8080/rest/v1/courses?id=eq.${course}" -H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ACCESS_TOKEN}"
          # back to the default (on)
          docker compose up -d app
          ./scripts/wait-for-stack.sh
          enabled=$(curl -fsS "http://localhost:8080/rest/v1/document_limits?select=enabled" -H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ACCESS_TOKEN}")
          echo "$enabled" | grep -q '"enabled":true'

      # "unlimited" must really lift every limit (a private NAS instance wants
      # that), and must not overflow the database's arithmetic. Then restore the
      # defaults.
      - name: DOCUMENT_*=unlimited lifts the limits
        run: |
          DOCUMENT_MAX_FILE_MB=unlimited DOCUMENT_USER_QUOTA_MB=unlimited DOCUMENT_MAX_COUNT=unlimited docker compose up -d app
          ./scripts/wait-for-stack.sh
          auth=(-H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ACCESS_TOKEN}")
          limits=$(curl -fsS "http://localhost:8080/rest/v1/document_limits?select=max_file_bytes,max_user_bytes,max_documents" "${auth[@]}")
          echo "limits: $limits"
          echo "$limits" | python3 -c "
          import json,sys
          row=json.load(sys.stdin)[0]
          assert row['max_file_bytes']==row['max_user_bytes']==10**15, row
          assert row['max_documents']==10**6, row
          "
          uid=$(python3 -c "import json;print(json.load(open('login.json'))['user']['id'])")
          course=$(curl -fsS -X POST http://localhost:8080/rest/v1/courses "${auth[@]}" -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "{\"user_id\":\"${uid}\",\"name\":\"Big\",\"short_code\":\"BIG\",\"color\":\"#000000\"}" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['id'])")
          # a 50 GB file and a second 50 GB one: both accepted (only the row is made, nothing is uploaded)
          for n in 1 2; do
            code=$(curl -sS -o big.json -w '%{http_code}' -X POST http://localhost:8080/rest/v1/course_documents "${auth[@]}" -H "Content-Type: application/json" -H "Prefer: return=representation" \
              -d "{\"user_id\":\"${uid}\",\"course_id\":\"${course}\",\"kind\":\"textbook\",\"filename\":\"atlas-${n}.pdf\",\"size_bytes\":53687091200}")
            echo "50 GB document $n -> HTTP $code"; cat big.json; echo
            [ "$code" = "201" ]
          done
          curl -fsS -X DELETE "http://localhost:8080/rest/v1/courses?id=eq.${course}" "${auth[@]}"
          # back to the defaults
          docker compose up -d app
          ./scripts/wait-for-stack.sh
          limits=$(curl -fsS "http://localhost:8080/rest/v1/document_limits?select=max_file_bytes,max_documents" "${auth[@]}")
          echo "$limits" | grep -q '"max_file_bytes":209715200'
          echo "$limits" | grep -q '"max_documents":200'

      # Chrome/Edge send `Accept-Encoding: gzip, deflate, br, zstd`. With that
      # header the edge runtime accepted the request, ran the function, and
      # never delivered the response. nginx strips it on /functions/v1/ — keep
      # a hard check so it can't regress.
      - name: Chromium-style Accept-Encoding (zstd) does not hang the edge runtime
        run: |
          curl -fsS --max-time 8 -X POST http://localhost:8080/functions/v1/instance-status \
            -H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ANON_KEY}" \
            -H "Accept-Encoding: gzip, deflate, br, zstd"

      # The cron endpoint is only meant for Postgres (pg_cron) and is guarded by
      # a shared secret; the function router must serve only the known functions.
      - name: Cron endpoint and function router reject what they should
        run: |
          CRON_SECRET=$(docker compose exec -T app cat /secrets/cron_secret)
          code() { curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$@"; }
          fn=http://localhost:8080/functions/v1
          [ "$(code -X POST $fn/send-notifications)" = "401" ]
          [ "$(code -X POST $fn/send-notifications -H 'x-cron-secret: wrong')" = "401" ]
          [ "$(code -X POST $fn/send-notifications -H "x-cron-secret: ${CRON_SECRET}")" = "200" ]
          [ "$(code -X POST $fn/main)" = "404" ]
          [ "$(code -X POST $fn/does-not-exist)" = "404" ]

      # env.js is rewritten from the container's env on every start, so it must
      # carry this deployment's real key and must never be cached.
      - name: Runtime config is fresh and security headers are set
        run: |
          headers=$(curl -fsSI http://localhost:8080/env.js)
          echo "$headers"
          echo "$headers" | grep -i '^cache-control:' | grep -qi 'no-cache'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^content-security-policy:'
          curl -fsS http://localhost:8080/env.js | grep -qF "$CI_ANON_KEY"

      # What `docker compose pull && up -d` does: containers are recreated, the
      # volumes stay. Secrets and the API key must be the same afterwards, the
      # database password must still work, and a token issued before must still
      # be accepted (i.e. the JWT secret was NOT regenerated).
      - name: Survives a restart with the same secrets
        run: |
          fp() { docker compose exec -T "$1" sha256sum "/secrets/$2" | cut -d' ' -f1; }
          jwt_before=$(fp app jwt_secret); cron_before=$(fp app cron_secret); pg_before=$(fp db postgres_password)
          docker compose down
          docker compose up -d
          ./scripts/wait-for-stack.sh
          [ "$jwt_before"  = "$(fp app jwt_secret)" ]
          [ "$cron_before" = "$(fp app cron_secret)" ]
          [ "$pg_before"   = "$(fp db postgres_password)" ]
          key=$(curl -fsS http://localhost:8080/env.js | sed -n 's/.*VITE_SUPABASE_PUBLISHABLE_KEY: "\(.*\)".*/\1/p')
          [ "$key" = "$CI_ANON_KEY" ]
          # a token from before the restart is still valid...
          [ "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/auth/v1/user \
            -H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ACCESS_TOKEN}")" = "200" ]
          # ...and the account (i.e. the database, with its original password) is intact
          [ "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "http://localhost:8080/auth/v1/token?grant_type=password" \
            -H "apikey: ${CI_ANON_KEY}" -H "Content-Type: application/json" \
            -d '{"email":"ci-user@accounts.local","password":"ci-test-password-123"}')" = "200" ]

      # The UI paths that depend on the runtime config. The app has no
      # configured URL and must call whichever address it was opened at, so run
      # the same flow against 127.0.0.1 (keeping the account) and then localhost.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: UI smoke test via 127.0.0.1 (sign in, widget URL is that address)
        run: BASE_URL=http://127.0.0.1:8080 SMOKE_KEEP_ACCOUNT=1 node scripts/ui-smoke.mjs

      - name: UI smoke test via localhost (sign in, widget URL, delete account)
        run: node scripts/ui-smoke.mjs

      - name: Deleting the account really removed it (back to a fresh instance)
        run: |
          body=$(curl -fsS -X POST http://localhost:8080/functions/v1/instance-status \
            -H "apikey: ${CI_ANON_KEY}" -H "Authorization: Bearer ${CI_ANON_KEY}")
          echo "$body"
          echo "$body" | grep -q '"hasAccounts":false'

      # Losing the secrets volume while keeping the database must NOT lead to a
      # silently different password (the app would then fail to log in): the
      # database container refuses to start and says why.
      - name: Refuses to invent a database password if the secrets volume is lost
        run: |
          docker compose down
          docker volume rm $(docker volume ls -q --filter label=com.docker.compose.volume=secrets)
          docker compose up -d db
          # Here-strings, not pipes: under `pipefail` a `logs | grep -q` can fail
          # with SIGPIPE when grep exits early.
          for i in $(seq 1 30); do
            logs=$(docker compose logs db 2>&1)
            grep -q "already exists, but its password isn't in" <<<"$logs" && break
            sleep 2
          done
          grep "FATAL" <<<"$logs" || true
          grep -q "already exists, but its password isn't in" <<<"$logs"
          # ...and it did not come up healthy
          ps=$(docker compose ps db 2>&1)
          echo "$ps"
          ! grep -q "(healthy)" <<<"$ps"
          docker compose down

      # An instance set up the old way (./setup.sh + .env, including SITE_URL)
      # must keep working when the new images are pulled: supplied values are
      # used as they are, SITE_URL is ignored, and nothing is generated.
      - name: An old-style .env still works (upgrade path)
        run: |
          docker compose down -v
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          make_jwt() {
            iat=$(date +%s); exp=$((iat + 315360000))
            h=$(printf '%s' '{"alg":"HS256","typ":"JWT"}' | b64url)
            p=$(printf '%s' "{\"role\":\"$1\",\"iss\":\"supabase\",\"iat\":${iat},\"exp\":${exp}}" | b64url)
            s=$(printf '%s' "$h.$p" | openssl dgst -sha256 -hmac "$2" -binary | b64url)
            printf '%s.%s.%s' "$h" "$p" "$s"
          }
          jwt=$(openssl rand -hex 32); anon=$(make_jwt anon "$jwt")
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "POSTGRES_DB=postgres"
            echo "POSTGRES_PORT=5432"
            echo "JWT_SECRET=$jwt"
            echo "JWT_EXP=3600"
            echo "ANON_KEY=$anon"
            echo "SERVICE_ROLE_KEY=$(make_jwt service_role "$jwt")"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$anon"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
            echo "SITE_URL=http://localhost:8080/"
            echo "APP_PORT=8080"
          } > .env
          docker compose up -d
          ./scripts/wait-for-stack.sh
          # Supplied values win: nothing is generated into the volume, and the
          # supplied anon key (not a derived one) is what the frontend gets.
          # Each check is named and its evidence printed, so a failure says which.
          failed=0
          check() { if "${@:2}"; then echo "  ok   - $1"; else echo "  FAIL - $1"; failed=1; fi; }
          echo "--- /secrets in app:"; docker compose exec -T app ls -la /secrets || true
          echo "--- /secrets in db:";  docker compose exec -T db  ls -la /secrets || true
          app_files=$(docker compose exec -T app ls -A /secrets 2>&1 || true)
          db_files=$(docker compose exec -T db ls -A /secrets 2>&1 || true)
          key=$(curl -fsS http://localhost:8080/env.js | sed -n 's/.*VITE_SUPABASE_PUBLISHABLE_KEY: "\(.*\)".*/\1/p')
          echo "--- anon key (public): supplied=${anon}"
          echo "                        served =${key}"
          check "app container generated nothing into /secrets" test -z "$app_files"
          check "db container generated nothing into /secrets" test -z "$db_files"
          check "frontend gets the supplied anon key" test "$key" = "$anon"
          [ "$failed" = 0 ]
          echo "CI_ANON_KEY=$anon" >> "$GITHUB_ENV"
          code=$(curl -sS -o legacy-signup.json -w '%{http_code}' -X POST http://localhost:8080/auth/v1/signup \
            -H "apikey: ${anon}" -H "Content-Type: application/json" \
            -d '{"email":"legacy-user@accounts.local","password":"ci-test-password-123"}')
          echo "HTTP ${code}"
          [ "$code" = "200" ]

      # Deliberately the last functional step: it exhausts this client's
      # rate-limit bucket for a while, which would fail any sign-in after it.
      - name: Auth endpoints are rate limited
        run: |
          limited=0
          for i in $(seq 1 60); do
            c=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X POST \
              "http://localhost:8080/auth/v1/token?grant_type=password" \
              -H "apikey: ${CI_ANON_KEY}" -H "Content-Type: application/json" \
              -d '{"email":"nobody@accounts.local","password":"wrong-password"}')
            [ "$c" = "429" ] && limited=$((limited + 1))
          done
          echo "rate-limited responses: ${limited}/60"
          [ "$limited" -gt 0 ]

      - name: Startup diagnostics
        if: always()
        run: |
          echo "=== app startup markers ==="
          docker compose logs app | grep -E "\[start\]|auth function owner|FATAL|fatal" || true
          echo "=== db startup markers ==="
          docker compose logs db | grep -E "\[db\]|FATAL" || true

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
