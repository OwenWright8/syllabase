# Self-hosted Syllabase — copy this file (and .env, generated by
# ./setup.sh) and run `docker compose up -d`. Just 2 services: Postgres,
# and one "app" container bundling everything else (auth, REST API, the
# 5 edge functions, and the frontend, with nginx as the internal
# gateway between them) — see Dockerfile and docker/start.sh.
#
# Image tags are pinned to match Supabase's own official self-hosting
# reference compose — see the Dockerfile's own note on why that matters
# (gotrue/postgrest/edge-runtime and this postgres version are tested
# together upstream, not interchangeable independently). Confirmed
# working via a live build+run in CI on linux/amd64; re-verify with
# `docker manifest inspect <image>:<tag>` before relying on this on
# another architecture (e.g. a Raspberry Pi).

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXP:-3600}
    # No `command:` override here on purpose — this image's default
    # command/entrypoint sets up shared_preload_libraries and other
    # internal config its own init scripts depend on (pg_stat_statements,
    # pg_cron, etc.); replacing it (as an earlier version of this file
    # did, to inject app.settings.cron_secret) breaks that setup with an
    # opaque "pg_stat_statements must be loaded via shared_preload_libraries"
    # error during first boot. The cron secret is set via `ALTER DATABASE
    # ... SET` from the app container's start.sh instead — see there.
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # `image:` lets `docker compose pull` grab the prebuilt release image;
    # `build:` is the fallback `docker compose build` uses if you'd rather
    # build from source. Override SYLLABASE_IMAGE_REPO/SYLLABASE_VERSION
    # in .env to pull from your own fork's registry instead.
    image: ${SYLLABASE_IMAGE_REPO:-ghcr.io/owenwright8/syllabase}:${SYLLABASE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXP:-3600}
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      CRON_SECRET: ${CRON_SECRET}
      SITE_URL: ${SITE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
