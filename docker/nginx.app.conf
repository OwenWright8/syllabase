# Serves the frontend AND acts as the internal API gateway (replacing
# Kong now that everything lives in one container) — proxies to the
# auth/rest/functions processes running as siblings in this same
# container. Always listens on 8080 internally regardless of what
# external port docker-compose.yml maps it to (APP_PORT), since other
# containers (the notification-cron job in `db`) reach this by that fixed
# internal port over the compose network.
server {
    listen 8080;
    server_name _;
    root /app/frontend;
    index index.html;

    # Prefix stripped by the trailing slash on proxy_pass, matching how
    # GoTrue/PostgREST/Edge Runtime expect to see paths at their own root
    # (this mirrors what Kong's strip_path did before consolidation).
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /functions/v1/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Don't forward the client's Accept-Encoding. The edge runtime
        # stalls — request accepted, function runs to completion, response
        # never delivered — when it is `gzip, deflate, br, zstd`, which is
        # exactly what Chrome/Edge send (Safari omits zstd, so it worked).
        # Confirmed by replaying the same request with curl: 5ms without
        # that header, timeout with it. Function responses are tiny JSON,
        # so asking upstream for identity encoding costs nothing.
        proxy_set_header Accept-Encoding "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
