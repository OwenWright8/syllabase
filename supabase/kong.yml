_format_version: "2.1"
# Declarative (DB-less) Kong config — single entry point for auth/rest/functions.
#
# Coarse gate: every route requires a valid Supabase API key (anon or
# service_role) via key-auth, exactly like Supabase Cloud — this rejects
# totally unauthenticated traffic. Fine-grained per-user auth is each
# service's own job: PostgREST decodes the caller's JWT itself for RLS,
# and the two edge functions that need a real user session
# (test-pushover-notification, delete-user) verify it in their own code
# via GoTrue rather than relying on gateway config — see their source.
# send-notifications and widget-stats are intentionally NOT session-gated
# at all (cron secret / API key instead), which this config doesn't change.
#
# Verify this against Supabase's current self-hosting reference compose
# before relying on it — Kong plugin config details can shift between
# Supabase releases and aren't fully re-verifiable from this environment.

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SERVICE_ROLE_KEY}

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true

  - name: functions-v1
    url: http://functions:9000/
    routes:
      - name: functions-v1-route
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
