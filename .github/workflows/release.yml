name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# Creates a GitHub Release (source code archives attached, notes
# auto-generated from merged PRs/commits since the last tag) and builds +
# pushes both images (the all-in-one app image and the extended db
# image) to GHCR, tagged with both the release version and `latest` —
# this is what makes `docker compose up -d` work for anyone without them
# building anything themselves.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Build source archives
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git archive --format=tar.gz --prefix="syllabase-${tag}/" -o "syllabase-${tag}.tar.gz" "${tag}"
          git archive --format=zip --prefix="syllabase-${tag}/" -o "syllabase-${tag}.zip" "${tag}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            syllabase-*.tar.gz
            syllabase-*.zip

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker/GHCR repository names must be lowercase; github.repository_owner
      # preserves the account's actual casing (e.g. "OwenWright8"), so it
      # can't be used directly in an image tag.
      - name: Compute lowercase image namespace
        run: echo "IMAGE_NAMESPACE=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/syllabase:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/syllabase:latest

      - name: Build and push db image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.db
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/syllabase-db:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/syllabase-db:latest
