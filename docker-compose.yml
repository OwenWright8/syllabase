# Syllabase — a self-hosted study planner.
#
#     docker compose up -d
#
# then open http://<this-machine>:8080. That's the whole setup: there is
# nothing to configure. On first start it generates its own secrets (database
# password, signing keys) and keeps them in the `secrets` volume. It uses
# whatever address you open it at, so an IP and port work as they are, and so
# does a domain behind your reverse proxy (put HTTPS in front of it there).
#
# Back up BOTH volumes (db-data holds your data, secrets holds the keys that go
# with it), or take a pg_dump, which doesn't depend on the keys.
#
# Optional: set POSTGRES_PASSWORD, JWT_SECRET, ANON_KEY, SERVICE_ROLE_KEY or
# CRON_SECRET (in your shell, or in a .env file beside this one) to use your own
# instead of generated ones. An existing install keeps working as it is: keep
# your .env and pass nothing else.
#
# Two services: Postgres, and one "app" container bundling everything else
# (auth, REST API, the 5 edge functions and the frontend, with nginx as the
# internal gateway between them) — see Dockerfile and docker/start.sh. Image
# versions are pinned to match Supabase's own self-hosting reference (they're
# tested together upstream, not interchangeable independently).

x-logging: &default-logging
  # Docker's default json-file driver never rotates, so a long-running
  # instance would eventually fill its disk with request logs.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # Extends supabase/postgres (see Dockerfile.db). `docker compose up -d`
    # pulls the prebuilt image; `docker compose build` builds it from source.
    image: ${SYLLABASE_IMAGE_REPO:-ghcr.io/owenwright8/syllabase}-db:${SYLLABASE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_EXP: ${JWT_EXP:-3600}
    volumes:
      - db-data:/var/lib/postgresql/data
      - secrets:/secrets
    logging: *default-logging
    # No `command:` override on purpose — the image's default sets up
    # shared_preload_libraries and other internal config its own init scripts
    # depend on (replacing it breaks first boot). Postgres is not published to
    # the host: the app reaches it over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${SYLLABASE_IMAGE_REPO:-ghcr.io/owenwright8/syllabase}:${SYLLABASE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXP: ${JWT_EXP:-3600}
      ANON_KEY: ${ANON_KEY:-}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # Course materials (uploaded textbooks and syllabi). All optional.
      DOCUMENTS: ${DOCUMENTS:-on}
      DOCUMENT_MAX_FILE_MB: ${DOCUMENT_MAX_FILE_MB:-}
      DOCUMENT_USER_QUOTA_MB: ${DOCUMENT_USER_QUOTA_MB:-}
      DOCUMENT_MAX_PAGES: ${DOCUMENT_MAX_PAGES:-}
    volumes:
      - secrets:/secrets
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
  secrets:
