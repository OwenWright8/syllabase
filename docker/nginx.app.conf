# Serves the frontend AND acts as the internal API gateway (replacing
# Kong now that everything lives in one container) — proxies to the
# auth/rest/functions processes running as siblings in this same
# container. Always listens on 8080 internally regardless of what
# external port docker-compose.yml maps it to (APP_PORT), since other
# containers (the notification-cron job in `db`) reach this by that fixed
# internal port over the compose network.

# Throttle the auth endpoints per client IP. GoTrue does not rate-limit
# password sign-in attempts on its own, so without this a script can guess
# passwords as fast as the server will answer. 60/min with a burst of 30 is
# far above what a person (or the SPA's hourly token refresh) ever sends.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /app/frontend;
    index index.html;

    # This container normally sits behind the operator's own reverse proxy
    # (Caddy, Traefik, nginx…) that terminates TLS, so every connection
    # arrives from a private address. Trust X-Forwarded-For from private
    # ranges only, so the rate limit above (and the access log) see the real
    # client. A client connecting from a *public* address can't spoof it.
    # (On a flat private network with no proxy the limiter is a speed bump,
    # not a guarantee: a LAN client could spoof the header.)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Set once here and inherited by every location. Locations below must
    # therefore avoid `add_header` (any add_header in a location drops ALL
    # inherited ones); they use `expires` for cache control instead.
    #   - CSP: no inline/remote script execution (the bundle has none), no
    #     plugins, no <base> hijacking, framing only by this same origin.
    #     Deliberately no default-src/connect-src so a deployment whose
    #     the app is opened at a different address than it was set up at
    #     (an IP, a domain, or several at once) still works.
    #   - This is a private planner: keep it out of search indexes.
    # HSTS is left to the TLS-terminating proxy; sent over plain HTTP it
    # would be ignored anyway.
    add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Compress the (multi-MB, uncompressed) JS/CSS bundle. Text assets only;
    # API responses from the proxied locations below are not compressed here.
    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml application/manifest+json;

    # Prefix stripped by the trailing slash on proxy_pass, matching how
    # GoTrue/PostgREST/Edge Runtime expect to see paths at their own root
    # (this mirrors what Kong's strip_path did before consolidation).
    location /auth/v1/ {
        limit_req zone=auth_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/v1/ {
        # Course-material uploads arrive as 1 MiB chunks, which PostgREST takes as
        # hex inside JSON (about 2.1 MB per request). nginx's default limit is 1 MB.
        # 4 MB leaves headroom without letting anyone push large bodies through
        # here (and the database itself rejects a chunk over 1 MiB).
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /functions/v1/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Don't forward the client's Accept-Encoding. The edge runtime
        # stalls — request accepted, function runs to completion, response
        # never delivered — when it is `gzip, deflate, br, zstd`, which is
        # exactly what Chrome/Edge send (Safari omits zstd, so it worked).
        # Confirmed by replaying the same request with curl: 5ms without
        # that header, timeout with it. Function responses are tiny JSON,
        # so asking upstream for identity encoding costs nothing.
        proxy_set_header Accept-Encoding "";
    }

    # Runtime config written by start.sh on every container start. Must
    # never be served from a cache: a rotated key has to take effect on the
    # next page load, not after a cache expires.
    location = /env.js {
        expires -1;
    }

    # Vite emits content-hashed filenames here, so they're safe to cache
    # for a year. A missing file must 404 rather than fall through to the
    # SPA's index.html and get cached as if it were a script.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Everything else (index.html, sw.js, manifest, icons) is un-hashed:
    # always revalidate (cheap 304s) so an app update is picked up at once.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
