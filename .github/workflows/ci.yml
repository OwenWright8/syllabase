name: CI

on:
  pull_request:
  push:
    branches:
      - main

# CI only reads the repo; no job needs a write-scoped token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit -p tsconfig.app.json

      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generate .env for the smoke test
        run: |
          ./setup.sh
          sed -i 's|^SITE_URL=.*|SITE_URL=http://localhost:8080|' .env

      - name: Validate docker-compose.yml
        run: docker compose config >/dev/null

      # Every secret is `${VAR:?...}` in the compose file; an empty one must
      # stop compose rather than boot an instance with a blank secret (an
      # empty CRON_SECRET used to leave the notification endpoint open).
      - name: Compose refuses to start with an empty secret
        run: |
          if CRON_SECRET= docker compose config >/dev/null 2>&1; then
            echo "compose accepted an empty CRON_SECRET"; exit 1
          fi

      # This is the real test: build from source and actually run the full
      # stack (db + app), not just confirm the image builds — a clean build
      # doesn't guarantee gotrue/postgrest/edge-runtime actually start and
      # talk to each other correctly inside the merged container.
      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the app to come up
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/ >/dev/null; then
              echo "App responded after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "App never came up"
          exit 1

      # nginx serves the static frontend even when a backend has crashed, so
      # "the page loads" proves very little. Everything below exercises the
      # real user flow end to end: GoTrue up (it runs its own long
      # migration set on first boot), the first-run status check, sign up,
      # log in, and the status check flipping once an account exists. An
      # earlier version of this job only hit instance-status and so passed
      # while GoTrue was crashing on startup and every signup 502'd.
      - name: Wait for GoTrue (auth) to come up
        run: |
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/auth/v1/health >/dev/null; then
              echo "GoTrue healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "GoTrue never became healthy"
          exit 1

      - name: Fresh instance reports no accounts yet
        run: |
          ANON_KEY=$(grep '^ANON_KEY=' .env | cut -d= -f2)
          body=$(curl -fsS -X POST http://localhost:8080/functions/v1/instance-status \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}")
          echo "$body"
          echo "$body" | grep -q '"hasAccounts":false'

      - name: Sign up
        run: |
          ANON_KEY=$(grep '^ANON_KEY=' .env | cut -d= -f2)
          code=$(curl -sS -o signup.json -w '%{http_code}' -X POST http://localhost:8080/auth/v1/signup \
            -H "apikey: ${ANON_KEY}" -H "Content-Type: application/json" \
            -d '{"email":"ci-user@accounts.local","password":"ci-test-password-123"}')
          echo "HTTP ${code}"; cat signup.json; echo
          [ "$code" = "200" ]
          grep -q '"access_token"' signup.json

      - name: Log in
        run: |
          ANON_KEY=$(grep '^ANON_KEY=' .env | cut -d= -f2)
          code=$(curl -sS -o login.json -w '%{http_code}' -X POST \
            "http://localhost:8080/auth/v1/token?grant_type=password" \
            -H "apikey: ${ANON_KEY}" -H "Content-Type: application/json" \
            -d '{"email":"ci-user@accounts.local","password":"ci-test-password-123"}')
          echo "HTTP ${code}"
          [ "$code" = "200" ]
          grep -q '"access_token"' login.json

      - name: Instance now reports an account exists (signup trigger + PostgREST + edge runtime)
        run: |
          ANON_KEY=$(grep '^ANON_KEY=' .env | cut -d= -f2)
          body=$(curl -fsS -X POST http://localhost:8080/functions/v1/instance-status \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}")
          echo "$body"
          echo "$body" | grep -q '"hasAccounts":true'

      # Chrome/Edge send `Accept-Encoding: gzip, deflate, br, zstd`. With that
      # header the edge runtime accepted the request, ran the function, and
      # never delivered the response (curl without it: ~5ms; Safari, which
      # omits zstd, was unaffected). nginx now strips the header on
      # /functions/v1/ — keep a hard check so it can't regress. curl alone
      # never reproduced this until the header was sent explicitly.
      - name: Chromium-style Accept-Encoding (zstd) does not hang the edge runtime
        run: |
          ANON_KEY=$(grep '^ANON_KEY=' .env | cut -d= -f2)
          curl -fsS --max-time 8 -X POST http://localhost:8080/functions/v1/instance-status \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}" \
            -H "Accept-Encoding: gzip, deflate, br, zstd"

      # The cron endpoint is only meant for Postgres (pg_cron) and is guarded
      # by a shared secret; the function router must serve only the known
      # functions (the name comes straight from the URL).
      - name: Cron endpoint and function router reject what they should
        run: |
          CRON_SECRET=$(grep '^CRON_SECRET=' .env | cut -d= -f2)
          code() { curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$@"; }
          fn=http://localhost:8080/functions/v1
          [ "$(code -X POST $fn/send-notifications)" = "401" ]
          [ "$(code -X POST $fn/send-notifications -H 'x-cron-secret: wrong')" = "401" ]
          [ "$(code -X POST $fn/send-notifications -H "x-cron-secret: ${CRON_SECRET}")" = "200" ]
          [ "$(code -X POST $fn/main)" = "404" ]
          [ "$(code -X POST $fn/does-not-exist)" = "404" ]

      # env.js is rewritten from the container's env on every start, so it
      # must carry this deployment's real key (derived from ANON_KEY) and
      # must never be cached; the gateway also sets baseline security headers.
      - name: Runtime config is fresh and security headers are set
        run: |
          ANON_KEY=$(grep '^ANON_KEY=' .env | cut -d= -f2)
          headers=$(curl -fsSI http://localhost:8080/env.js)
          echo "$headers"
          echo "$headers" | grep -i '^cache-control:' | grep -qi 'no-cache'
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^content-security-policy:'
          curl -fsS http://localhost:8080/env.js | grep -qF "$ANON_KEY"

      # The UI paths that depend on the runtime config injected into
      # /env.js (widget URL, Delete Account) — see scripts/ui-smoke.mjs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: UI smoke test (sign in, widget URL, delete account)
        run: node scripts/ui-smoke.mjs

      - name: Deleting the account really removed it (back to a fresh instance)
        run: |
          ANON_KEY=$(grep '^ANON_KEY=' .env | cut -d= -f2)
          body=$(curl -fsS -X POST http://localhost:8080/functions/v1/instance-status \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}")
          echo "$body"
          echo "$body" | grep -q '"hasAccounts":false'

      # Deliberately the last functional step: it exhausts this client's
      # rate-limit bucket for a while, which would fail any sign-in after it.
      - name: Auth endpoints are rate limited
        run: |
          limited=0
          for i in $(seq 1 60); do
            c=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X POST \
              "http://localhost:8080/auth/v1/token?grant_type=password" \
              -H "apikey: $(grep '^ANON_KEY=' .env | cut -d= -f2)" -H "Content-Type: application/json" \
              -d '{"email":"nobody@accounts.local","password":"wrong-password"}')
            [ "$c" = "429" ] && limited=$((limited + 1))
          done
          echo "rate-limited responses: ${limited}/60"
          [ "$limited" -gt 0 ]

      - name: Startup diagnostics
        if: always()
        run: |
          echo "=== app startup markers ==="
          docker compose logs app | grep -E "\[start\]|auth function owner|FATAL|fatal" || true

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
