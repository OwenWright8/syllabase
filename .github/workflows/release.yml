name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
# Creates a GitHub Release (source code archives attached, notes
# auto-generated from merged PRs/commits since the last tag) and builds +
# pushes the frontend and seed-accounts images to GHCR, tagged with both
# the release version and `latest` — this is what makes `docker compose
# up -d` work for anyone without them building anything themselves.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Build source archives
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git archive --format=tar.gz --prefix="syllabase-${tag}/" -o "syllabase-${tag}.tar.gz" "${tag}"
          git archive --format=zip --prefix="syllabase-${tag}/" -o "syllabase-${tag}.zip" "${tag}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            syllabase-*.tar.gz
            syllabase-*.zip

  docker:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/syllabase-frontend:${{ inputs.tag || github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/syllabase-frontend:latest

      - name: Build and push seed-accounts image
        run: |
          cat > Dockerfile.seed-accounts <<'EOF'
          FROM node:20-alpine
          WORKDIR /app
          COPY docker/seed-accounts.mjs .
          CMD ["node", "seed-accounts.mjs"]
          EOF
          tag="${{ inputs.tag || github.ref_name }}"
          docker build -f Dockerfile.seed-accounts \
            -t "ghcr.io/${{ github.repository_owner }}/syllabase-seed-accounts:${tag}" \
            -t "ghcr.io/${{ github.repository_owner }}/syllabase-seed-accounts:latest" \
            .
          docker push "ghcr.io/${{ github.repository_owner }}/syllabase-seed-accounts:${tag}"
          docker push "ghcr.io/${{ github.repository_owner }}/syllabase-seed-accounts:latest"
