# Self-hosted Syllabase stack: Postgres + GoTrue (auth) + PostgREST (REST
# API) + Kong (single gateway) + Edge Runtime (the app's 4 remaining
# functions) + the static frontend, plus two one-shot setup services
# (migrate, seed-accounts) that make `docker compose up -d` a complete,
# repeatable deploy — including "resetting" a password, which is just
# editing accounts.env and running this again.
#
# Deliberately NOT included: Realtime, Storage, ImgProxy (the app uses
# none of them) and Studio (optional — see the commented service below).
#
# Before relying on this in production: verify these image tags exist for
# your host's architecture (`docker manifest inspect <image>:<tag>`) —
# this was written without live access to Supabase's current release
# list, so tags below are illustrative and should be confirmed/updated.

services:
  db:
    image: supabase/postgres:15.8.1.049
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXP:-3600}
    # Sets the GUC the notification-cron migration reads its header secret
    # from, so no secret needs to live in a SQL file.
    command:
      - postgres
      - -c
      - app.settings.cron_secret=${CRON_SECRET}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: postgres:15-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]

  auth:
    image: supabase/gotrue:v2.170.0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXP:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # The whole point of this deployment model: no public signup, no
      # email flows, no SMTP dependency at all. Accounts come from
      # seed-accounts only.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}

  functions:
    image: supabase/edge-runtime:v1.65.1
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      CRON_SECRET: ${CRON_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
    command: ["start", "--main-service", "/home/deno/functions"]

  kong:
    image: kong:3.7
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - functions
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: cors,key-auth,acl
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./supabase/kong.yml:/kong.yml:ro
    ports:
      - "${KONG_HTTP_PORT:-8000}:8000"

  seed-accounts:
    # `image:` lets `docker compose pull` grab the prebuilt release image;
    # `build:` is the fallback `docker compose build` uses if you'd rather
    # build from source. Override SYLLABASE_IMAGE_REPO/SYLLABASE_VERSION
    # in .env to pull from your own fork's registry instead.
    image: ${SYLLABASE_IMAGE_REPO:-ghcr.io/owenwright8/syllabase}-seed-accounts:${SYLLABASE_VERSION:-latest}
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY docker/seed-accounts.mjs .
        CMD ["node", "seed-accounts.mjs"]
    depends_on:
      - auth
    env_file:
      # Separate from .env on purpose — accounts.env is the one file you
      # touch to add a user or reset a password, kept apart from the
      # deployment-wide secrets in .env. Optional so `docker compose
      # config`/`up` doesn't hard-fail before you've copied
      # accounts.env.example to accounts.env.
      - path: accounts.env
        required: false
    environment:
      GOTRUE_URL: http://auth:9999
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}

  frontend:
    # Same image/build split as seed-accounts above. VITE_SUPABASE_URL and
    # VITE_SUPABASE_PUBLISHABLE_KEY are passed at runtime (not build args)
    # since the entrypoint injects them into env.js at container start —
    # see Dockerfile and docker/40-inject-env.sh — which is what makes one
    # prebuilt image usable across everyone's own domain/keys.
    image: ${SYLLABASE_IMAGE_REPO:-ghcr.io/owenwright8/syllabase}-frontend:${SYLLABASE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - kong
      - seed-accounts
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # Optional admin UI — off by default given Pi-class hardware constraints.
  # Bring up with: docker compose --profile studio up -d studio
  # studio:
  #   image: supabase/studio:latest
  #   profiles: ["studio"]
  #   environment:
  #     SUPABASE_URL: http://kong:8000
  #     SUPABASE_ANON_KEY: ${ANON_KEY}
  #     SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
  #   ports:
  #     - "54323:3000"

volumes:
  db-data:
