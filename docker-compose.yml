# Self-hosted Syllabase — copy this file (and .env, generated by
# ./setup.sh) and run `docker compose up -d`. Just 2 services: Postgres,
# and one "app" container bundling everything else (auth, REST API, the
# 5 edge functions, and the frontend, with nginx as the internal
# gateway between them) — see Dockerfile and docker/start.sh.
#
# Before relying on this in production: verify the `db` image tag exists
# for your host's architecture (`docker manifest inspect <image>:<tag>`),
# and see the Dockerfile's own caution note about the `app` image's
# upstream binary paths — neither has been confirmed against a live build
# in the environment this was written in.

services:
  db:
    image: supabase/postgres:15.8.1.049
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXP:-3600}
    # Sets the GUC the notification-cron migration reads its header secret
    # from, so no secret needs to live in a SQL file.
    command:
      - postgres
      - -c
      - app.settings.cron_secret=${CRON_SECRET}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    # `image:` lets `docker compose pull` grab the prebuilt release image;
    # `build:` is the fallback `docker compose build` uses if you'd rather
    # build from source. Override SYLLABASE_IMAGE_REPO/SYLLABASE_VERSION
    # in .env to pull from your own fork's registry instead.
    image: ${SYLLABASE_IMAGE_REPO:-ghcr.io/owenwright8/syllabase}:${SYLLABASE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXP:-3600}
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      CRON_SECRET: ${CRON_SECRET}
      SITE_URL: ${SITE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
